[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflight"
version = "0.1.0"
description = "An auditing tool to prevent AI coding agents from tampering with or deleting tests."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Astel Antony" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
agentflight = "agentflight:main"