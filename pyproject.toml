[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflight-cli"
version = "1.0.1"
description = "An open-source auditing tool to prevent AI coding agents from tampering with test assertions."
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name="Astel Antony", email="tintupro1@gmail.com" },
]
dependencies = [
    "pytest"
]

[project.scripts]
agentflight = "agentflight:main"